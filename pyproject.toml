[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revelador"
dynamic = ["version"]
description = "Escolhe fotos e prepara cada uma para revelação: enquadramento na proporção exata do papel (10x15, 15x21, 20x30...) centrado nos rostos, ajustes de luz e cor e pastas separadas por tamanho para o laboratório."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vitor Gabriel" }]
keywords = ["revelação", "fotos", "impressão", "photo printing", "crop", "face detection", "PySide6"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Editors :: Raster-Based",
    "Topic :: Printing",
]
dependencies = [
    "PySide6>=6.8",
    "numpy>=2.0",
    "Pillow>=11.0",
    "pillow-heif>=1.0",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6.10",
]

[project.gui-scripts]
revelador = "revelador.app:main"

[tool.setuptools.dynamic]
version = { attr = "revelador.__version__" }

[tool.setuptools.packages.find]
include = ["revelador", "revelador.*"]

# A configuração do pytest fica em pytest.ini.
